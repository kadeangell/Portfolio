name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      # Secrets can't be used in `if:` directly, so expose whether they're set.
      # The Workers deploy below is skipped until both secrets exist.
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install

      - name: Build legacy SvelteKit site
        run: |
          cd legacy/v1
          pnpm install
          pnpm run build

      - name: Build TanStack Start site
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/client

      # Cloudflare Workers (static assets, see wrangler.jsonc). Runs after the
      # GitHub Pages deploy so a failure here can't affect the live site. Until
      # the custom domain is moved over it only serves from *.workers.dev.
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.166.0'
          command: deploy
